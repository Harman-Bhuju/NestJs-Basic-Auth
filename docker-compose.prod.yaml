services:
  api:
    image: harman0701/nestjs-basic-auth:latest
    container_name: nestjs-basic-auth
    restart: unless-stopped
    ports:
      - '127.0.0.1:5000:5000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - postgres_network 

networks:
  postgres_network:
    name: postgres_network
    external: true
    # it says this network already exists elsewhere, don't try to create it — just join it.
