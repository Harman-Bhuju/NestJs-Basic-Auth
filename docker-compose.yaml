services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    ports: 
    - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    ports:
    - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: harmanbhuju@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Harman123!