services:

  api:
    #harman0701 = Docker Hub username/namespace.
    # It tells Docker which Docker Hub repository this image belongs to.
    # This allows the production server to pull the image from
    # your Docker Hub account.
    image: harman0701/nestjs-basic-auth:1.0 # writing image name
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-basic-auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

volumes:
  postgres_data: